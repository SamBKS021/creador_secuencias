[package]
name = "creador_de_secuencias"
version = "0.1.13"
edition = "2021"

[lib]
name = "creador_de_secuencias_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"
serde_json = "1"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
docx-rs = "0.4"
keyring = "3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "pool", "rustls-tls"] }
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
roxmltree = "0.20"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "0.6"
